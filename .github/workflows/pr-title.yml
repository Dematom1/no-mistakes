name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json

permissions:
  pull-requests: read

jobs:
  check:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate conventional commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|chore|ci|docs|refactor|test|perf|build|revert)(\([^)]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title must use a conventional commit type, optional scope and optional !: $PR_TITLE"
            exit 1
          fi
